<!DOCTYPE html>
<!--
  a href: enlace a otra página o archivo
  target="_blank": abre el enlace en otra pestaña
  target="_parent": lo abre en la misma pestaña
  href="#inicio": enlace a la parte de la página que tiene id="inicio"
  ../ : sube una carpeta
  img: imagen (src = ruta, alt = texto si no carga, width y height = tamaño)
  img dentro de a: la imagen es un enlace
  ul: lista con puntos
  ol: lista numerada (type="A" con letras, type="1" con números)
  li: elemento de la lista
  style="...": CSS dentro de la etiqueta
-->
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
