<!DOCTYPE html>
<!--
  form: formulario (method="post" es la forma de enviar los datos)
  label: texto del campo (su for tiene que ser igual que el id del input)
  input type="text": campo de texto
  name: nombre del dato al enviarlo
  submit: botón de enviar
  reset: botón de borrar
  br: salto de línea
-->
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formularios</title>
</head>
<body>
	<h1>Formularios</h1>
	<!-- Formulario de registro de datos-->

	<form target="_blank" method="post">

		<label for="txtNombre">Nombre:</label>	
		<input type="text" name="txtNombre" id="txtNombre"> <br>

		<label for="txtApellido">Apellido:</label>	
		<input type="text" name="txtApellido" id="txtApellido"> <br>

		<input id="btnEnvio" value="Enviar" type="submit">
		<input type="reset" value="Borrar">

	</form>



</body>
</html>
